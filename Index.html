<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javiera Oyarce | Portafolio</title>
    <style>
        /* Estilos generales para organizar la página en dos columnas */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fdfdfd;
            display: flex;
        }

        /* Menú de navegación lateral fijo */
        nav {
            width: 240px;
            height: 100vh;
            background-color: #ffffff;
            border-right: 1px solid #eaeaea;
            position: fixed;
            top: 0;
            left: 0;
            padding: 30px 20px;
            box-sizing: border-box;
        }

        nav h2 {
            font-size: 1.1rem;
            color: #111;
            margin-bottom: 40px;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        nav ul li {
            margin-bottom: 20px;
        }

        nav ul li a {
            text-decoration: none;
            color: #555;
            font-size: 1rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav ul li a:hover {
            color: #000;
            font-weight: bold;
        }

        /* Contenido principal a la derecha del menú */
        main {
            margin-left: 240px; /* Deja espacio para que el menú no tape el contenido */
            padding: 60px;
            width: calc(100% - 240px);
            box-sizing: border-box;
        }

        h1 {
            font-size: 2.5rem;
            color: #111;
        }

        p {
            color: #666;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <!-- Menú Lateral al Costado -->
    <nav>
        <h2>Javiera Oyarce</h2>
        <ul>
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Proyectos</a></li>
            <li><a href="#">Contacto</a></li>
        </ul>
    </nav>

    <!-- Contenido Principal -->
    <main>
        <h1>Hola, soy Javiera Oyarce</h1>
        <p>Diseñadora en Comunicación Visual</p>
    </main>

</body>
</html>
